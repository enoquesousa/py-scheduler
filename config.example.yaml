# Exemplo de configuração de jobs para o py-scheduler.
# Cada job referencia um nome registrado em código (JobRegistry).
# Retry usa Exponential Backoff e, se omitido, tenta 3 vezes.
#
# Persistência: SQLite grava cada tentativa (sucesso, falha com retry, falha final).
# database_path: "" desativa o armazenamento.
# Com database_path ativo e webhook.failure_alert_silence_minutes > 0, o estado do
# muzzle (último alerta de falha por job) também fica neste ficheiro — sobrevive a restarts.
#
# Métricas Prometheus em /metrics (prometheus_client):
#   metrics_enabled: false   # desliga o servidor HTTP
#   metrics_host: 127.0.0.1   # ou metrics_host: 0.0.0.0 em rede/container (cuidado: expõe em todas as interfaces)
#   metrics_port: 9100
#
# Módulo que registra callables (register(registry)); sobrescreve PY_SCHEDULER_JOBS_MODULE.
# jobs_register_module: minha_empresa.scheduler_jobs

database_path: scheduler.sqlite
metrics_enabled: true
metrics_host: 127.0.0.1
metrics_port: 9100
#
# Webhook HTTPS opcional: após esgotar retentativas, envia POST JSON genérico com
# job_id, job_name, erro sanitizado e timestamp. Com notify_on_success: true, envia também
# após cada execução bem-sucedida (útil para tarefas críticas).
# O receptor deve aceitar este formato; Slack/Discord podem exigir um adaptador.
# Injete as variáveis no processo; não há carregamento automático de .env.
# A URL inteira pode ser secreta (path/query). Não grave credenciais neste YAML.
#
# webhook:
#   url_env: SCHEDULER_WEBHOOK_URL
#   # Opcional, somente se o receptor validar Authorization: Bearer.
#   bearer_token_env: SCHEDULER_WEBHOOK_TOKEN
#   timeout_seconds: 10
#   # Muzzle: depois de um alerta de falha, não reenvia para o mesmo job por N minutos
#   # (reduz spam no Slack se a tarefa falha em ciclo). 0 = desligado.
#   failure_alert_silence_minutes: 30
#
# Para um receptor local de desenvolvimento com dados sintéticos:
# webhook:
#   url: http://127.0.0.1:9000/events
#   allow_loopback_http: true
# Não combine HTTP com bearer_token_env. URLs remotas exigem HTTPS.

jobs:
  - id: exemplo_segundos
    name: exemplo_tick
    interval:
      seconds: 5
    retry:
      attempts: 3
      wait_multiplier_seconds: 1
      wait_min_seconds: 1
      wait_max_seconds: 30

  - id: exemplo_minutos
    name: exemplo_relatorio
    interval:
      minutes: 1

  - id: exemplo_horas
    name: exemplo_manutencao
    interval:
      hours: 1
