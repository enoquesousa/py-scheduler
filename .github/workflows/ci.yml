name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Dependency review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          comment-summary-in-pr: never

  lint-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade "pip==26.2" "setuptools==84.1.0"
          python -m pip install -e ".[dev]"
          python -m pip check

      - name: Ruff check
        run: python -m ruff check .

      - name: Ruff format
        run: python -m ruff format --check .

      - name: Tests
        run: python -m pytest

      - name: Audit installed dependencies
        run: |
          python - <<'PYTHON'
          import importlib.metadata
          import os
          from pathlib import Path

          packages = sorted(
              f"{dist.metadata['Name']}=={dist.version}"
              for dist in importlib.metadata.distributions()
              if dist.metadata['Name'].lower().replace('_', '-') != 'py-scheduler'
          )
          # The editable project is source under test, not a third-party PyPI package.
          Path(os.environ['RUNNER_TEMP'], 'scheduler-audit.txt').write_text(
              '\n'.join(packages) + '\n', encoding='utf-8'
          )
          PYTHON
          python -m venv "$RUNNER_TEMP/scheduler-audit"
          "$RUNNER_TEMP/scheduler-audit/bin/python" -m pip install "pip==26.2" "setuptools==84.1.0" "pip-audit==2.10.1"
          "$RUNNER_TEMP/scheduler-audit/bin/python" -m pip_audit --strict --no-deps --disable-pip -r "$RUNNER_TEMP/scheduler-audit.txt"

      - name: Build sdist and wheel
        if: matrix.python-version == '3.12'
        run: |
          python -m venv "$RUNNER_TEMP/scheduler-build"
          "$RUNNER_TEMP/scheduler-build/bin/python" -m pip install "pip==26.2" "setuptools==84.1.0" "build==1.6.1"
          "$RUNNER_TEMP/scheduler-build/bin/python" -m build

  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: lint-test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade "pip==26.2" "setuptools==84.1.0"
          python -m pip install -e ".[dev]"

      - name: Tests with coverage
        run: python -m pytest --cov=py_scheduler --cov-report=xml

      - name: Preserve coverage report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-python312
          path: coverage.xml
          if-no-files-found: error

  codecov:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: coverage
    # External coverage uploads are disabled. Re-enabling requires explicit
    # authorization of coverage.xml and the Codecov destination, plus a separate
    # review of any upload credential. The report stays in GitHub artifacts.
    if: ${{ false }}
    permissions:
      contents: read
    steps:
      - name: Checkout minimal coverage context
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: /README.md
          sparse-checkout-cone-mode: false

      - name: Download coverage report
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-python312
          path: coverage

      - name: Disabled external coverage upload
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: coverage/coverage.xml
          disable_search: true
          disable_file_fixes: true
          disable_safe_directory: true
          plugins: noop
          fail_ci_if_error: true
